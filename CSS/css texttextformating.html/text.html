<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>

        h1{
            text-align:left;
        }
        h2{
            text-align:right;
        }
        body{ background-color: aqua;
            text-align: center;
            background-image:url(backgroundimage.1.jpg);
            background-repeat:repeat;
            background-size: cover;
            background-position: left;
        }
        .underline{
            text-decoration: underline;
        }
        .weight{
            color: rgb(255, 255, 255);
            font-weight: bolder;
        }
        *{
            color: rgb(0, 0, 0);
            text-shadow:azure;
            font-family: 'Courier New', Courier, monospace;
        }
        .lineheight{
            line-height: 2;
        }
        .text{
           
            text-transform: capitalize;
        }
    
    </style>
</head>
<body>
    <h1 class="text">This is Heading 1</h1>
    <br>
    <h2>This is Heading 2</h2>
    <br>
    <p class="lineheight">Lorem ipsum dolor sit amet 
        consectetur adipisicing elit. Eaque, voluptate!</p>
        <br>
        <p class="underline">Lorem ipsum dolor sit amet 
            consectetur adipisicing elit. Eaque, voluptate!</p>
            <br>
            <h1 style="text-decoration: underline;">This is Heading 1</h1>
            <br>
            <h1 style="text-decoration: overline;">This is Heading 2</h1>
            <br>
            <h1 style="text-decoration: line-through;">This is Heading 3</h1>
            <br><br><br>
            <p class="weight"> Font Weight</p>
</body>
</html>
