<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Example</title>
</head>
<body>
    <h1>Welcome to My Website</h1>
    <p>Here are some images:</p>

    <!-- Image 1 -->
    <img src="https://via.placeholder.com/300" alt="Sample Image 1" width="300" height="200">

    <!-- Image 2 -->
    <img src="https://via.placeholder.com/150" alt="Sample Image 2" width="150" height="150">

    <!-- Image with link -->
    <a href="https://www.example.com">
        <img src="https://via.placeholder.com/250" alt="Clickable Image" width="250">
    </a>

    <!-- Image with a caption -->
    <figure>
        <img src="https://via.placeholder.com/400" alt="Sample Image 3" width="400" height="250">
        <figcaption>This is a caption for the image.</figcaption>
    </figure>
</body>
</html>
