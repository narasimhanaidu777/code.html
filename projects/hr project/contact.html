<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f9f9f9;
            background-image:url(back.jpg);
            background-repeat: no-repeat;
            background-size: cover;
        }

        .header {
            
            color:#007bff;
            padding: 20px;
            text-align: center;
        }

        .contact-container {
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding: 40px;
        }

        .contact-info, .contact-form {
            background-color: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            width: 45%;
        }

        h2 {
            text-align: center;
            margin-bottom: 20px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            font-size: 14px;
            margin-bottom: 5px;
        }

        .form-group input, .form-group textarea {
            width: 100%;
            padding: 10px;
            font-size: 16px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        .form-group input[type="submit"] {
            background-color:#007bff;
            color: white;
            cursor: pointer;
            border: none;
        }

        .form-group input[type="submit"]:hover {
            background-color:#007bff;
        }

        .contact-info p {
            font-size: 16px;
            margin: 10px 0;
        }

        .error-message {
            color: red;
            font-size: 12px;
            text-align: center;
        }
        *{
            font-family: algerian;
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>Contact Us</h1>
    </div>

    <div class="contact-container">
        <!-- Contact Info -->
        <div class="contact-info">
            <h2>Our Contact Details</h2>
            <p><strong>Address:</strong> sandip university , Nashik ,Maharastra,422213</p>
            <p><strong>Email:</strong> contact@problemsolvers.com</p>
            <p><strong>Phone:</strong> +123-456-7890</p>
            <p><strong>Business Hours:</strong> Mon - Fri: 9:00 AM - 6:00 PM</p>
        </div>

        <!-- Contact Form -->
        <div class="contact-form">
            <h2>Send Us a Message</h2>
            <form id="contactForm">
                <div class="form-group">
                    <label for="name">Your Name</label>
                    <input type="text" id="name" name="name" placeholder="Enter your name" required>
                </div>
                <div class="form-group">
                    <label for="email">Your Email</label>
                    <input type="email" id="email" name="email" placeholder="Enter your email" required>
                </div>
                <div class="form-group">
                    <label for="message">Your Message</label>
                    <textarea id="message" name="message" placeholder="Enter your message" rows="5" required></textarea>
                </div>
                <div class="form-group">
                    <input type="submit" value="Send Message">
                </div>
            </form>
            <div class="error-message" id="formErrorMessage"></div>
        </div>
    </div>

    <script>
        // Handle the contact form submission
        document.getElementById('contactForm').addEventListener('submit', function(event) {
            event.preventDefault();

            var name = document.getElementById('name').value;
            var email = document.getElementById('email').value;
            var message = document.getElementById('message').value;
            var errorMessage = document.getElementById('formErrorMessage');

            // Basic validation
            if (name === '' || email === '' || message === '') {
                errorMessage.textContent = 'All fields are required!';
                return;
            }

            // Clear the error message if inputs are valid
            errorMessage.textContent = '';

            // For testing, log the input values to the console
            console.log('Name:', name);
            console.log('Email:', email);
            console.log('Message:', message);

            // Normally, you would send this data to a server using an API (AJAX)
            alert('Message sent successfully! We will get back to you soon.');
        });
    </script>

</body>
</html>
