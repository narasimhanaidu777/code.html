<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0px;
            background-color: #f4f4f4;
            background-image: url(back.jpg);
            background-repeat: no-repeat;
            background-size: cover;
        }

        .login-container {
            background-color: white;
            padding: 20px;
            border-radius: 30px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            width: 350px;
            text-align: left;
            
        }

        h2 {
            text-align: center;
            margin-bottom: 20px;
            
        }

        .form-group {
            margin-bottom: 15px;
            margin-right: 20px;
        }

        .form-group label {
            display: block;
            font-size: 14px;
            margin-bottom: 5px;
        }

        .form-group input {
            width: 100%;
            padding: 10px;
            font-size: 16px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        .form-group input[type="submit"] {
            background-color: #007bff;
            color: white;
            cursor: pointer;
        }

        .form-group input[type="submit"]:hover {
            background-color: #007bff;
        }

        .error-message {
            color: red;
            font-size: 12px;
            text-align: center;
        }
        *{
            font-family: algerian;
        }
    </style>
</head>
<body>

    <div class="login-container">
        <h2>Sign In</h2>
        <form id="loginForm">
            <!-- First Name -->
            <div class="form-group">
                <label for="firstName">First Name</label>
                <input type="text" id="firstName" name="firstName" placeholder="Enter your First Name" required>
            </div>

            <!-- Last Name -->
            <div class="form-group">
                <label for="lastName">Last Name</label>
                <input type="text" id="lastName" name="lastName" placeholder="Enter your Last Name" required>
            </div>

            <!-- Mobile Number -->
            <div class="form-group">
                <label for="mobileNumber">Mobile Number</label>
                <input type="text" id="mobileNumber" name="mobileNumber" placeholder="Enter your Mobile Number" required pattern="\d{10}">
                <small>Enter a 10-digit mobile number.</small>
            </div>

            <!-- Email -->
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" placeholder="Enter your Email" required>
            </div>

            <!-- User ID -->
            <div class="form-group">
                <label for="userId">User ID</label>
                <input type="text" id="userId" name="userId" placeholder="Enter your User ID" required>
            </div>

            <!-- Password -->
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" placeholder="Enter your Password" required>
            </div>

            <!-- Submit Button -->
            <div class="form-group">
                <input type="submit" value="Sign In">
            </div>

            <!-- Error Message -->
            <div class="error-message" id="errorMessage"></div>
        </form>
    </div>

    <script>
        // Simple sign-in form validation
        document.getElementById('loginForm').addEventListener('submit', function(event) {
            event.preventDefault();

            var firstName = document.getElementById('firstName').value;
            var lastName = document.getElementById('lastName').value;
            var mobileNumber = document.getElementById('mobileNumber').value;
            var email = document.getElementById('email').value;
            var userId = document.getElementById('userId').value;
            var password = document.getElementById('password').value;
            var errorMessage = document.getElementById('errorMessage');

            // Basic validation
            if (firstName === '' || lastName === '' || mobileNumber === '' || email === '' || userId === '' || password === '') {
                errorMessage.textContent = 'All fields are required!';
                return;
            }

            // Validate mobile number (should be a 10-digit number)
            if (!/^\d{10}$/.test(mobileNumber)) {
                errorMessage.textContent = 'Please enter a valid 10-digit mobile number.';
                return;
            }

            // Validate email format
            if (!/\S+@\S+\.\S+/.test(email)) {
                errorMessage.textContent = 'Please enter a valid email address.';
                return;
            }

            // Clear error message
            errorMessage.textContent = '';

            // For now, log the values to the console (for testing purposes)
            console.log('First Name:', firstName);
            console.log('Last Name:', lastName);
            console.log('Mobile Number:', mobileNumber);
            console.log('Email:', email);
            console.log('User ID:', userId);
            console.log('Password:', password);

            // Here, you would typically send this data to the server for authentication

            alert('Sign-In Successful!');
        });
    </script>

</body>
</html>
